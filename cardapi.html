<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>API Product Card</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>

    <div class="container mt-5">

        <div class="card" style="width: 18rem;">

            <img id="productImage" class="card-img-top">

            <div class="card-body">

                <h5 id="productTitle" class="card-title"></h5>

                <h6 id="productCategory"
                    class="card-subtitle mb-2 text-body-secondary">
                </h6>

                <p id="productDescription" class="card-text"></p>

                <h5 id="productPrice"></h5>

                <a href="#" class="btn btn-primary">Buy Now</a>

            </div>

        </div>

    </div>


    <script>

        async function fetchProduct() {

            let response = await fetch(
                "https://fakestoreapi.com/products/1"
            );

            let data = await response.json();

            console.log(data);

            document.getElementById("productImage").src = data.image;

            document.getElementById("productTitle").innerText = data.title;

            document.getElementById("productCategory").innerText =
                data.category;

            document.getElementById("productDescription").innerText =
                data.description;

            document.getElementById("productPrice").innerText =
                "$" + data.price;
        }

        fetchProduct();

    </script>

</body>

</html>
